name: Build

# main : compile et vérifie l'exe (artefact). Publier une version : onglet Actions → Build →
# « Run workflow » avec un numéro (ex. v0.2.0), ou pousser un tag vX.Y.Z. La version est créée,
# puis Aion 2 Todo se redéploie pour proposer le nouvel exe au téléchargement.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. v0.2.0). Vide = compilation seule."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TODO_DISPATCH_TOKEN: ${{ secrets.TODO_DISPATCH_TOKEN }}
      # Version publiée : tag poussé, ou saisie dans « Run workflow ».
      RELEASE: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: python -m pip install -r requirements.txt

      - name: Version
        shell: pwsh
        run: |
          $v = if ($env:RELEASE) { $env:RELEASE } else { "dev-" + $env:GITHUB_SHA.Substring(0, 7) }
          Set-Content -Path version.txt -Value $v -NoNewline
          Write-Host "Version : $v"

      - name: Compilation
        shell: pwsh
        run: ./build.ps1

      # L'exe doit démarrer et charger ses modules (sans Npcap sur le runner : le test le note dans le log).
      - name: Test de démarrage
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\aion2-pet-meter.exe -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "L'exe ne s'est pas arrêté" }
          $log = Get-ChildItem -Path dist, "$env:LOCALAPPDATA\AION2-pet-meter" -Filter aion2_pet_meter.log -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $log) { throw "Pas de log : l'exe n'a pas démarré" }
          Get-Content $log.FullName
          if (Select-String -Path $log.FullName -Pattern "scapy FAIL") { throw "scapy ne se charge pas dans l'exe" }

      - uses: actions/upload-artifact@v6
        with:
          name: aion2-pet-meter
          path: dist/aion2-pet-meter.exe

      - name: Publication de la version
        if: env.RELEASE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:RELEASE" dist/aion2-pet-meter.exe --target "$env:GITHUB_SHA" --title "Pet Meter $env:RELEASE" --generate-notes

      - name: Mise à jour du site Aion 2 Todo
        if: env.RELEASE != '' && env.TODO_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.TODO_DISPATCH_TOKEN }}
        run: gh api repos/Tomtoxi44/aion2-todo/dispatches -f event_type=pet-meter-release
